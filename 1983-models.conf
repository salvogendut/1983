# 1983 machine catalogue
#
# Add another model by copying a section and giving it a unique identifier.
# "hardware" must name a layout currently implemented by 1983:
# msx1, msx2, or nms8250. Firmware paths may be absolute or relative to this
# file. General > Machine applies each definition exactly as written; compose
# or change firmware sets in Advanced > Machine model editor. A supported
# floppy controller also declares its primary and secondary slot.
# C-BIOS is included; firmware for the other models is user-supplied.

[model cbios]
name = C-BIOS MSX
hardware = msx1
bios = ROMS/cbios_main_msx1.rom
logo = ROMS/cbios_logo_msx1.rom
subrom =
disk_rom =
floppy_controller = none
floppy_primary_slot =
floppy_secondary_slot =

