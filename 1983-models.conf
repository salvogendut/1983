# 1983 machine catalogue
#
# Add another model by copying a section and giving it a unique identifier.
# "hardware" must name a layout currently implemented by 1983:
# msx1, msx2, or nms8250. Firmware paths may be absolute or relative to this
# file. Leave a required path empty to choose it with the Machine file picker.
# Firmware ROM images are user-supplied and are never included in the project.

[model msx1]
name = MSX
hardware = msx1
bios = ROMS/MSX.ROM
logo =
subrom =
disk_rom =

[model msx2]
name = MSX2
hardware = msx2
bios = ROMS/MSX2.ROM
logo =
subrom = ROMS/MSX2EXT.ROM
disk_rom =

[model nms8250]
name = Philips NMS 8250
hardware = nms8250
bios = ROMS/nms8250_basic-bios2.rom
logo =
subrom = ROMS/nms8250_msx2sub.rom
disk_rom = ROMS/nms8250_disk.rom
