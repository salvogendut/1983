name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Fedora 44)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build and package dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc make autoconf automake pkgconf-pkg-config SDL3-devel git \
            rpm-build rpmdevtools desktop-file-utils libappstream-glib
      - uses: actions/checkout@v4
      - name: Mark workspace as a safe Git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure and build
        run: |
          autoreconf -iv
          ./configure --prefix=/usr
          make -j$(nproc)
      - name: Test and validate metadata
        run: |
          make check
          desktop-file-validate io.github.salvogendut.Emulator1983.desktop
          appstream-util validate-relax --nonet \
            io.github.salvogendut.Emulator1983.metainfo.xml
      - name: Build portable Linux bundle
        run: |
          set -eu
          bundle=dist/1983-linux-x86_64
          mkdir -p "$bundle"
          cp 1983 1983-models.conf 1983.conf.example LICENSE README.md \
            INSTALL.md "$bundle/"
          mkdir -p "$bundle/ROMS"
          cp ROMS/README.C-BIOS ROMS/cbios_logo_msx1.rom \
            ROMS/cbios_main_msx1.rom "$bundle/ROMS/"
          tar -C dist -czf dist/1983-linux-x86_64.tar.gz \
            1983-linux-x86_64
          temporary_config=$(mktemp)
          rm -f "$temporary_config"
          (cd /tmp && "$GITHUB_WORKSPACE/$bundle/1983" \
            --config "$temporary_config" --headless --unthrottled \
            --exit-after 0)
          grep -q '^model = cbios$' "$temporary_config"
      - name: Build source archive and RPM
        run: |
          set -eu
          rpmdev-setuptree
          make dist
          cp 1983-*.tar.gz ~/rpmbuild/SOURCES/
          cp 1983.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/1983.spec
          mkdir -p rpm-out
          find ~/rpmbuild/RPMS -name '1983-[0-9]*.rpm' \
            -exec cp {} rpm-out/ \;
          test -n "$(find rpm-out -name '1983-[0-9]*.rpm' -print -quit)"
      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: 1983-linux-x86_64
          path: dist/1983-linux-x86_64.tar.gz
      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: 1983-fedora-x86_64-rpm
          path: rpm-out/*.rpm

  windows:
    name: Windows (MinGW x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2, MinGW, and SDL3
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-sdl3
            autoconf
            automake
      - name: Configure, build, and test
        run: |
          autoreconf -iv
          ./configure
          make -j$(nproc)
          make check
      - name: Stage portable Windows bundle
        run: |
          set -eu
          mkdir dist
          cp 1983.exe 1983-models.conf 1983.conf.example LICENSE README.md \
            INSTALL.md dist/
          mkdir -p dist/ROMS
          cp ROMS/README.C-BIOS ROMS/cbios_logo_msx1.rom \
            ROMS/cbios_main_msx1.rom dist/ROMS/
          for dll in $(ldd dist/1983.exe | awk '/mingw64/ {print $3}'); do
            cp "$dll" dist/
          done
          temporary_config=$(mktemp)
          rm -f "$temporary_config"
          workspace=$(cygpath -u "$GITHUB_WORKSPACE")
          (cd /tmp && "$workspace/dist/1983.exe" \
            --config "$temporary_config" --headless --unthrottled \
            --exit-after 0)
          grep -q '^model = cbios$' "$temporary_config"
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: 1983-windows-x86_64
          path: dist/

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install autoconf automake pkg-config sdl3 dylibbundler
      - name: Configure, build, and test
        run: |
          autoreconf -iv
          ./configure
          make -j$(sysctl -n hw.logicalcpu)
          make check
      - name: Package and smoke-test application bundle
        run: |
          version="$(sed -n 's/^PACKAGE_VERSION = //p' Makefile)"
          sh packaging/macos/package.sh ./1983 dist/1983.app "$version"
          temporary_config=$(mktemp)
          rm -f "$temporary_config"
          (cd /tmp && "$GITHUB_WORKSPACE/dist/1983.app/Contents/MacOS/1983" \
            --config "$temporary_config" --headless --unthrottled \
            --exit-after 0)
          grep -q '^model = cbios$' "$temporary_config"
          ditto -c -k --sequesterRsrc --keepParent \
            dist/1983.app "dist/1983-macos-${{ matrix.arch }}.zip"
      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: 1983-macos-${{ matrix.arch }}
          path: dist/1983-macos-${{ matrix.arch }}.zip

  flatpak:
    name: Flatpak (x86_64)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: 1983.flatpak
          manifest-path: io.github.salvogendut.Emulator1983.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: 1983-flatpak-x86_64
          path: 1983.flatpak

  release:
    name: Publish GitHub Release
    needs: [linux, windows, macos, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          mkdir -p assets
          cp artifacts/1983-linux-x86_64/1983-linux-x86_64.tar.gz \
            "assets/1983-${tag}-linux-x86_64.tar.gz"
          cp artifacts/1983-fedora-x86_64-rpm/*.rpm assets/
          (cd artifacts/1983-windows-x86_64 && \
            zip -r "../../assets/1983-${tag}-windows-x86_64.zip" .)
          cp artifacts/1983-macos-arm64/1983-macos-arm64.zip \
            "assets/1983-${tag}-macos-arm64.zip"
          cp artifacts/1983-macos-x86_64/1983-macos-x86_64.zip \
            "assets/1983-${tag}-macos-x86_64.zip"
          cp artifacts/1983-flatpak-x86_64/1983.flatpak \
            "assets/1983-${tag}-x86_64.flatpak"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
